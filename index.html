<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HerVoice – Safety, support &amp; equality</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@1,500&family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--p:#8B5BBF;--pd:#5C3585;--pl:#EFE6F8;--r:#C97BB2;--rl:#F7EDF4;--t:#3D7874;--tl:#E6F3F2;--bg:#FAF6FD;--sf:#fff;--tx:#2D1840;--mu:#7A5C92;--bd:rgba(139,91,191,.18);--al:#B3261E;--alb:#FDECEA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p:#B48BE0;--pd:#D9C2F2;--pl:#2E1F42;--rl:#3A2234;--tl:#1D3331;--t:#8FD0CA;--bg:#150C20;--sf:#211330;--tx:#F2E9FA;--mu:#B79ACC;--bd:rgba(180,139,224,.22);--al:#FF8A80;--alb:#3A1B1B}}
:root[data-theme="dark"]{--p:#B48BE0;--pd:#D9C2F2;--pl:#2E1F42;--rl:#3A2234;--tl:#1D3331;--t:#8FD0CA;--bg:#150C20;--sf:#211330;--tx:#F2E9FA;--mu:#B79ACC;--bd:rgba(180,139,224,.22);--al:#FF8A80;--alb:#3A1B1B}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'DM Sans','Noto Sans Myanmar',sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;font-size:15px;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:'Playfair Display',serif;font-style:italic;font-size:24px;color:var(--pd);margin-right:auto}
.seg{display:flex;border:1px solid var(--bd);border-radius:30px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:30px;font-size:13px;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--p);color:#fff}
.hb{border:1px solid var(--bd);background:var(--sf);border-radius:30px;padding:7px 14px;font-size:13px;font-weight:600}
.hb.sos{background:var(--al);color:#fff;border-color:var(--al)}
:root[data-theme="dark"] .hb.sos,:root:not([data-theme="light"]) .hb.sos{color:#2a0a08}
.shell{display:block}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu);padding:4px 12px}
nav button[aria-current=page]{color:var(--p);font-weight:600}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:16px 16px 96px;max-width:760px;margin:0 auto}
.view{display:none}.view.on{display:block}
h2{font-size:22px;margin-bottom:2px}
.sub{color:var(--mu);margin-bottom:14px}
.note{background:var(--tl);color:var(--t);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--mu)}
.chip[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:var(--pl);color:var(--pd);margin-right:4px}
.meta{font-size:12px;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.btn{border:0;border-radius:24px;padding:9px 18px;background:var(--p);color:#fff;font-weight:600;font-size:14px}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#1a0b2a}
.btn.ghost{background:none;border:1px solid var(--bd);color:var(--tx)}
.btn.done{background:var(--tl);color:var(--t)}
.link{background:none;border:0;color:var(--mu);font-size:13px;text-decoration:underline;padding:4px}
textarea,input[type=text],input[type=search]{width:100%;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:10px 12px;margin-bottom:10px}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;gap:10px}
.avatar{display:inline-block;width:38px;height:38px;border-radius:50%;background:var(--rl);overflow:hidden;margin-right:8px;vertical-align:middle}.avatar svg,.ico svg{width:100%;height:100%;display:block}.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}.ico svg{width:24px;height:24px;fill:none;stroke-width:2;stroke-linecap:round}.cast{display:flex;justify-content:center;gap:28px;align-items:flex-end;margin:6px 0 22px}.cast figure{text-align:center;font-weight:600;color:var(--mu)}.cast svg{height:170px;width:auto;display:block;margin:0 auto 4px}.art{background:var(--pl);border-radius:10px;height:56px;display:grid;place-items:center;margin-bottom:8px}
.hero{text-align:center;padding:36px 8px 10px}
.hero h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:clamp(34px,8vw,56px);color:var(--pd);line-height:1.1;margin-bottom:12px}
.hero p{color:var(--mu);max-width:46ch;margin:0 auto 20px}
.pillars{display:grid;gap:10px;margin:22px 0}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(20,8,30,.55);display:none;align-items:flex-end;justify-content:center}
.dlg.on{display:flex}
.sheet{background:var(--sf);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet.al{border-top:6px solid var(--al)}
.num{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0;background:var(--alb)}
.num b{font-size:20px;color:var(--al)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pd);color:#fff;border-radius:24px;padding:9px 18px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
:root[data-theme="dark"] .toast,:root:not([data-theme="light"]) .toast{background:var(--p);color:#1a0b2a}
.toast.on{opacity:1}
#neutral{position:fixed;inset:0;z-index:100;background:#fff;color:#222;display:none;padding:40px 24px;font-family:Georgia,serif}
#neutral.on{display:block}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
@media(min-width:900px){
 nav{top:58px;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:6px;padding:20px 12px;border-top:0;border-right:1px solid var(--bd)}
 nav button{flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;border-radius:12px;width:100%}
 nav button[aria-current=page]{background:var(--pl)}
 main{margin-left:210px;max-width:none;padding:28px 40px 60px}
 .wrap{max-width:900px}
 .grid.two{grid-template-columns:1fr 1fr}
 .pillars{grid-template-columns:repeat(3,1fr)}
 .dlg{align-items:center}.sheet{border-radius:22px}
 .toast{bottom:30px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 $('v-hub').innerHTML=`<h2>${s.hub}</h2><p class="sub">${s.hubSub}</p>
 <input type="search" id="hq" placeholder="${s.search}" aria-label="${s.search}" value="${esc(q)}">
 <div class="chips">${['all',...Object.keys(KN)].map(k=>`<button class="chip" aria-pressed="${k==cat}" onclick="setCat('${k}')">${k=='all'?s.all:KN[k][lang]}</button>`).join('')}</div>
 <p class="note">${s.partner}</p><div class="grid two">${list.map(o=>`<article class="card" style="margin:0"><div style="display:flex;gap:12px"><span class="ico" style="background:${o.bg}" aria-hidden="true"><svg viewBox="0 0 24 24" stroke="${o.c}">${o.ic}</svg></span><div><b>${o.n}</b><p class="meta" style="font-size:14px">${o.d[lang]}</p></div></div>
 <div style="margin-top:8px">${o.k.map(k=>`<span class="tag">${KN[k][lang]}</span>`).join('')}<span class="tag" style="background:var(--tl);color:var(--t)">✓ ${s.verified}</span></div>
 <div class="row"><span class="meta">${s.chk}: Oct 2026</span><button class="btn ${contacted.has(o.id)?'done':''}" onclick="contacted.add(${o.id});toast(t().connect+': '+ORGS[${o.id-1}].n);hub()">${contacted.has(o.id)?'✓ '+s.saved:s.connect}</button></div></article>`).join('')}</div><p class="meta" style="margin-top:10px">${s.web}</p>`;
 const h=$('hq');h.oninput=()=>{q=h.value;const p=h.selectionStart;hub();const n=$('hq');n.focus();n.setSelectionRange(p,p)}}
function learn(){const s=t();
 $('v-learn').innerHTML=`<h2>${s.L}</h2><p class="sub">${s.LSub}</p><div class="grid two">${ARTS.map((a,i)=>`<button class="card" style="text-align:left;margin:0" onclick="openArt(${i})"><div class="art" aria-hidden="true">${ARTSVG[i]}</div><span class="tag">${a.tag[lang]}</span><p style="margin-top:6px"><b>${a.t[lang]}</b></p><span class="meta">${a.m} ${s.read}</span></button>`).join('')}</div>`}
function openArt(i){const a=ARTS[i],s=t();$('artBody').innerHTML=`<span class="tag">${a.tag[lang]}</span><h2 style="margin-top:8px">${a.t[lang]}</h2><p style="margin:10px 0 16px">${a.b[lang]}</p><p class="note">${s.disc}</p><div class="row"><button class="btn ghost" onclick="$('artDlg').classList.remove('on')">${s.close}</button><button class="btn" onclick="saved.add(${i});toast(t().saved);$('artDlg').classList.remove('on');me()">${s.save}</button></div>`;$('artDlg').classList.add('on')}
function me(){const s=t(),dark=document.documentElement.dataset.theme=='dark';
 $('v-me').innerHTML=`<h2>${s.me}</h2><p class="sub">${s.meSub}</p>
 <div class="card"><span class="avatar" style="width:56px;height:56px">${mas('linh')}</span><b>Linh #3041</b><div class="row" style="justify-content:space-around;text-align:center">${[mine.length,saved.size,contacted.size].map((n,i)=>`<div><b style="font-size:22px">${n}</b><div class="meta">${s.stats[i]}</div></div>`).join('')}</div></div>
 <div class="card">${s.s.map((x,i)=>`<div class="set"><div><b>${x[0]}</b><div class="meta">${x[1]}</div></div>${i==2?`<button class="chip" onclick="toggleTheme()">${dark?s.on:s.off}</button>`:i==1?`<button class="chip" onclick="quickExit()">${s.qe}</button>`:'<span class="tag">✓</span>'}</div>`).join('')}</div>
 <p class="note">${s.qeNote}</p>`}
function toggleTheme(){const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';me()}
function sos(){const s=t();const n=NUMS[lang=='my'?'my':'vi'];
 $('sosBody').innerHTML=`<h2>${s.sosT}</h2><p class="sub">${s.sosP}</p>${n.map(x=>`<div class="num"><span>${s[x[1]]}</span><a href="tel:${x[0]}" style="text-decoration:none"><b>${x[0]}</b></a></div>`).join('')}<p class="meta" style="margin:10px 0 14px">${s.sosV}</p><button class="btn ghost" style="width:100%" onclick="$('sosDlg').classList.remove('on')">${s.close}</button>`;$('sosDlg').classList.add('on')}
function quickExit(){$('neutral').classList.add('on');document.title='Weather'}
$('neutral').onclick=()=>{$('neutral').classList.remove('on');document.title='HerVoice – Safety, support & equality'};
$('qeBtn').onclick=quickExit;$('sosBtn').onclick=sos;
document.querySelectorAll('.dlg').forEach(d=>d.addEventListener('click',e=>{if(e.target==d)d.classList.remove('on')}));
let esc1=0;document.addEventListener('keydown',e=>{if(e.key!='Escape')return;document.querySelectorAll('.dlg.on').forEach(d=>d.classList.remove('on'));if(Date.now()-esc1<700)quickExit();esc1=Date.now()});
render();

</script>
</body>
</html>
